[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-usdm-safety-bot"
version = "0.1.0"
description = "Safety-first modular Binance USD-M Futures trading system scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.1",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
postgres = [
  "asyncpg>=0.29.0",
]

[project.scripts]
trading-bot = "trading_bot.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
